<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Returns counter — Chimp.OS Collection</title>
  <script src="../js/boot.js"></script>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <style>
    .counter {
      height: 100%;
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 12px;
      padding: 12px;
    }
    .queue, .slip {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }
    .queue-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto; }
    .viewer { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .crt { flex: 1; }
    .receipt { padding: 12px; }
    .receipt h3 { margin: 6px 0; font-family: var(--font-display); font-size: 30px; line-height: 0.9; font-weight: 400; }
    .slip-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; }
    .choices { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .choice {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px;
      border-radius: calc(var(--radius) - 4px);
      border: 1px solid color-mix(in srgb, var(--paper-ink) 25%, transparent);
      background: color-mix(in srgb, var(--paper) 70%, white);
      color: var(--paper-ink);
      text-align: left;
    }
    .choice.is-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .choice i {
      width: 36px; height: 28px; border-radius: 4px;
      background: var(--gold);
      display: block;
    }
    .actions { display: flex; gap: 8px; margin-top: auto; }
    .q-copy { min-width: 0; }
    .q-copy strong, .q-copy small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-copy small { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
</head>
<body data-screen="Returns counter">
  <div class="app fit">
    <header id="topbar" class="topbar"></header>
    <main class="stage">
      <div class="counter">
        <aside class="panel queue">
          <div class="toolbar">
            <h2 class="aisle-sign"><span>In the drop</span></h2>
          </div>
          <p class="note">12 photos waiting. Reads finish while you file the one on the glass.</p>
          <div class="queue-list">
            <button type="button" class="q-item is-active">
              <span class="q-thumb"><span class="art" data-cover="one-ring"></span></span>
              <span class="q-copy"><strong>The One Ring</strong><small>Magic · 94%</small></span>
              <span class="status ready">Ready</span>
            </button>
            <button type="button" class="q-item">
              <span class="q-thumb"><span class="art" data-cover="grogu"></span></span>
              <span class="q-copy"><strong>Grogu</strong><small>Funko · 97%</small></span>
              <span class="status ready">Ready</span>
            </button>
            <button type="button" class="q-item">
              <span class="q-thumb"><span class="art" data-cover="joke"></span></span>
              <span class="q-copy"><strong>Needs a title</strong><small>Photo 014 · glare</small></span>
              <span class="status hold">Label</span>
            </button>
            <button type="button" class="q-item">
              <span class="q-thumb"><span class="art" data-cover="saga-1"></span></span>
              <span class="q-copy"><strong>Saga #1</strong><small>Still reading</small></span>
              <span class="status tracking">Tracking</span>
            </button>
            <button type="button" class="q-item">
              <span class="q-thumb"><span class="art" data-cover="pi-5"></span></span>
              <span class="q-copy"><strong>Raspberry Pi 5</strong><small>Filed to the rack</small></span>
              <span class="status filed">Filed</span>
            </button>
            <button type="button" class="q-item">
              <span class="q-thumb"><span class="art" data-cover="vegeta"></span></span>
              <span class="q-copy"><strong>Vegeta Metallic</strong><small>Funko · 92%</small></span>
              <span class="status ready">Ready</span>
            </button>
          </div>
          <a class="btn ghost" href="08-bulk-drop.html">Or dump a whole folder</a>
        </aside>
        <section class="viewer">
          <div class="crt">
            <div class="art" data-cover="one-ring"></div>
            <div class="crt-tag"><span class="rec-dot"></span> Tracking · photo 011</div>
          </div>
          <div class="toolbar">
            <span class="kicker">Light table</span>
            <span class="grow">Phone drop · same Wi-Fi</span>
          </div>
        </section>
        <article class="receipt slip">
          <div class="receipt-head"><span>REWIND</span><span>MATCH SLIP</span></div>
          <hr class="rule" />
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="stamp">MATCH</span>
            <span>94%</span>
          </div>
          <h3>The One Ring</h3>
          <div class="slip-row"><span>Aisle</span><b>Magic</b></div>
          <div class="slip-row"><span>Set</span><b>LTR · 001</b></div>
          <div class="slip-row"><span>Finish</span><b>Nonfoil</b></div>
          <p class="kicker" style="margin-top:8px;color:inherit">Price guide hits</p>
          <div class="choices">
            <button type="button" class="choice is-on"><i></i><span><b>LTR · 001</b><small style="display:block">Showcase · nonfoil</small></span><b>$89.00</b></button>
            <button type="button" class="choice"><i style="background:var(--neon)"></i><span><b>LTR · 001</b><small style="display:block">Showcase · foil</small></span><b>$164</b></button>
            <button type="button" class="choice"><i style="background:var(--accent)"></i><span><b>LTR · 451</b><small style="display:block">Bundle promo</small></span><b>$71</b></button>
          </div>
          <div class="slip-row"><span>Bin</span><b>Binder · Mythic</b></div>
          <div class="actions">
            <button type="button" class="btn solid">File it</button>
            <button type="button" class="btn on-paper">Fix label</button>
          </div>
          <p class="note" style="color:inherit">Be kind, rewind</p>
        </article>
      </div>
    </main>
  </div>
  <script src="../js/shell.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
